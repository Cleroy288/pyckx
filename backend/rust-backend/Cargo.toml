[package]
name = "LAPP"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web framework
actix-web = "4"
actix-cors = "0.7"
actix-files = "0.6"

# Async runtime
tokio = { version = "1.48.0", features = ["full"] }

# HTTP client
reqwest = { version = "0.12", features = ["json"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Base64 encoding/decoding (for JWT payload)
base64 = "0.22"

# UUID generation for session IDs
uuid = { version = "1", features = ["v4"] }

# Redis session store
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }

# Validation
validator = { version = "0.18", features = ["derive"] }

# Environment
dotenv = "0.15"

# Logging & Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

# Error handling (keeping for compatibility, but we use custom errors)
thiserror = "1"

# Concurrent HashMap for rate limiting
dashmap = "6"

# DateTime handling
chrono = { version = "0.4", features = ["serde"] }

# Async traits
async-trait = "0.1"

# URL encoding for query parameters
urlencoding = "2.1"

# Document extraction
pdf-extract = "0.7"
docx-rs = "0.4"
# PowerPoint extraction (PPTX is a ZIP with XML)
zip = "2.1"

# Multipart form handling
actix-multipart = "0.7"
futures-util = "0.3"
regex = "1.12.2"

[dev-dependencies]
# Property-based testing
proptest = "1.4"
# Temporary files for testing
tempfile = "3"
# HTTP integration testing for actix-web
actix-test = "0.1"
actix-rt = "2"
