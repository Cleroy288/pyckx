[package]
name = "leptos-app"
version = "0.1.0"
edition = "2021"

[dependencies]
leptos = { version = "0.7", features = ["csr"] }
leptos_router = "0.7"
console_error_panic_hook = "0.1"
stylance = "0.5"
gloo-net = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
web-sys = { version = "0.3", features = ["Window", "Location"] }
wasm-bindgen = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 'z'
panic = "abort"
strip = true

# Stylance configuration for scoped CSS modules
[package.metadata.stylance]
# Bundle all .module.css files into this file
output_file = "./styles/bundle.css"
# Look for CSS modules in these folders
folders = ["./src/", "./styles/"]
# File extensions to process
extensions = [".module.css"]
# Hash length for scoped class names
hash_len = 7
# Class name pattern: original-name-hash
class_name_pattern = "[name]-[hash]"
