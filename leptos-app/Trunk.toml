[serve]
# Development server port
port = 8083

[build]
# Output to backend's static folder
dist = "../backend/static"
# Disable subresource integrity to fix CSS loading issues in development
# See: https://crbug.com/981419
no_sri = true

[watch]
# Watch source files and CSS modules, but NOT the generated bundle
watch = ["src", "index.html", "styles/global.css", "styles/background.module.css"]
# Ignore the generated bundle to prevent infinite loop
ignore = ["styles/bundle.css"]

# Pre-build hook: Run stylance to bundle CSS modules
[[hooks]]
stage = "pre_build"
command = "stylance"
command_arguments = [".", "--output-file", "./styles/bundle.css"]
